services:
  claude-telegram-bot:
    build: .
    container_name: claude-telegram-bot
    restart: unless-stopped
    
    # Environment configuration
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - LOG_LEVEL=INFO
    
    # Mount configuration and data
    volumes:
      # Configuration
      - ./.env:/app/.env:ro
      
      # Database persistence
      - ./data:/app/data
      
      # Mount your projects directory (adjust path as needed)
      - /Users/frolov/projects/tutu:/app/projects:ro
      
      # Mount Claude CLI config for Claude Code Max authentication
      - ~/.config/claude:/home/appuser/.config/claude:ro
    
    # Network mode for accessing local services if needed
    # network_mode: host
    
    # Resource limits
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.1'
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "import sqlite3; sqlite3.connect('/app/data/bot.db').execute('SELECT 1')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# Optional: External network for multiple services
# networks:
#   claude-network:
#     driver: bridge

volumes:
  # Named volume for persistent data (alternative to bind mount)
  bot-data:
    driver: local